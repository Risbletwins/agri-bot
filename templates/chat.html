<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>কৃষি সহকারী চ্যাট | Agri Servitor Chat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; background-color: #f8f9fa; color: #333; height: 100vh; display: flex; flex-direction: column; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .chat-message { margin-bottom: 0; padding: 10px 15px; border-radius: 10px; max-width: 80%; display: inline-block; }
        .user-message { background-color: #dcf8c6; align-self: flex-end; }
        .bot-message { background-color: #ffffff; border: 1px solid #ddd; align-self: flex-start; }
        .input-group { padding: 10px; background-color: #fff; border-top: 1px solid #ddd; }
        .lang-toggle { position: absolute; top: 10px; right: 120px; z-index: 1000; }
        .speed-control { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 8px; align-items: center; }
        .audio-player { margin-top: 10px; }
        .spinner { display: none; }
        .error-message { color: red; text-align: center; }
        footer { background-color: #e9ecef; padding: 10px 0; text-align: center; font-size: 0.8rem; }

        /* Mic listening animation */
        .mic-btn { position: relative; }
        .mic-btn.listening { animation: pulse 1s infinite; box-shadow: 0 0 10px rgba(0,123,255,0.4); border-radius: 6px; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        /* Playing indicator (equalizer) */
        .playing-indicator { display: inline-flex; gap: 3px; align-items: center; margin-left: 8px; }
        .bar { width: 3px; height: 12px; background: #007bff; animation: bar 0.8s infinite ease-in-out; opacity: 0.9; }
        .bar:nth-child(2) { animation-delay: 0.1s; height: 8px; }
        .bar:nth-child(3) { animation-delay: 0.2s; height: 14px; }
        @keyframes bar { 0% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } 100% { transform: scaleY(0.4); } }

        /* Speaker icon */
        .speaker-icon { margin-left: 8px; color: #007bff; }

        /* Hide default audio UI */
        audio { display: none !important; }
    </style>
</head>
<body>
    <!-- Language Toggle -->
    <div class="lang-toggle">
        <button id="lang-btn" class="btn btn-secondary">English</button>
    </div>

    <!-- Speed control (client-side only) -->
    <div class="speed-control">
        <label for="speed-range" id="speed-label" style="font-size:0.9rem;">Speed: 1.25x</label>
        <input id="speed-range" type="range" min="0.6" max="2.0" step="0.05" value="1.25" style="width:140px;" />
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">কৃষি সহকারী</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">হোম</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/chat">কৃষি সহকারী</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Chat Container -->
    <div class="chat-container d-flex" id="chat-history">
        <div class="chat-message bot-message">
            <i class="fas fa-robot me-2"></i>
            <span data-bn="স্বাগতম! আপনার কৃষি সংক্রান্ত যেকোনো প্রশ্ন করুন।" data-en="Welcome! Ask any agriculture-related questions.">স্বাগতম! আপনার কৃষি সংক্রান্ত যেকোনো প্রশ্ন করুন।</span>
        </div>
    </div>

    <!-- Input Group -->
    <div class="input-group">
        <div class="container">
            <div class="row">
                <div class="col-12 d-flex gap-2 align-items-start">
                    <input type="text" id="question-input" class="form-control" placeholder="আপনার প্রশ্ন লিখুন..." aria-label="Question input">
                    <button id="voice-btn" class="btn btn-outline-secondary mic-btn" aria-label="Toggle voice input"><i class="fas fa-microphone"></i></button>
                    <button id="send-btn" class="btn btn-primary"><i class="fas fa-paper-plane"></i> <span data-bn="পাঠান" data-en="Send">পাঠান</span></button>
                </div>
                <div class="col-12 mt-2">
                    <div id="loading-spinner" class="spinner-border text-primary mt-2 spinner" role="status" style="display:none;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p id="error-message" class="error-message mt-2"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p data-bn="© ২০২৫ কৃষি সহকারী — কৃষকদের ক্ষমতায়ন এআই ও অটোমেশনের মাধ্যমে" data-en="© 2025 Agri Servitor — Empowering farmers through AI and automation">© ২০২৫ কৃষি সহকারী — কৃষকদের ক্ষমতায়ন এআই ও অটোমেশনের মাধ্যমে</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // UI elements & state
    const langBtn = document.getElementById('lang-btn');
    const elements = document.querySelectorAll('[data-bn], [data-en]');
    const questionInput = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');
    const voiceBtn = document.getElementById('voice-btn');
    const chatHistory = document.getElementById('chat-history');
    const loadingSpinner = document.getElementById('loading-spinner');
    const errorMessage = document.getElementById('error-message');
    const speedRange = document.getElementById('speed-range');
    const speedLabel = document.getElementById('speed-label');

    let currentLang = localStorage.getItem('lang') || 'bn';
    let recognition = null;
    const DEFAULT_SPEED = 1.25;
    let isPlayingAudio = false;

    // Initialize speed slider
    const savedSpeed = parseFloat(localStorage.getItem('playback_rate') || DEFAULT_SPEED);
    speedRange.value = savedSpeed;
    speedLabel.textContent = `Speed: ${savedSpeed.toFixed(2)}x`;

    speedRange.addEventListener('input', () => {
        const v = parseFloat(speedRange.value);
        speedLabel.textContent = `Speed: ${v.toFixed(2)}x`;
        localStorage.setItem('playback_rate', v.toFixed(2));
    });

    function getPlaybackRate() {
        return parseFloat(localStorage.getItem('playback_rate') || speedRange.value || DEFAULT_SPEED);
    }

    // Language toggle
    function toggleLanguage() {
        currentLang = currentLang === 'bn' ? 'en' : 'bn';
        localStorage.setItem('lang', currentLang);
        langBtn.textContent = currentLang === 'bn' ? 'English' : 'বাংলা';
        elements.forEach(el => {
            const text = el.getAttribute(`data-${currentLang}`) || el.textContent;
            el.textContent = text;
        });
        questionInput.placeholder = currentLang === 'bn' ? 'আপনার প্রশ্ন লিখুন...' : 'Type your question...';
        document.documentElement.lang = currentLang;
        if (recognition) recognition.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
    }

    if (currentLang === 'en') toggleLanguage();
    langBtn.addEventListener('click', toggleLanguage);

    // Append message (user or bot)
    function appendMessage(type, text, audioUrls = []) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('chat-message', type === 'user' ? 'user-message' : 'bot-message');
        const icon = type === 'bot' ? '<i class="fas fa-robot me-2"></i>' : '<i class="fas fa-user me-2"></i>';
        const textNode = document.createElement('span');
        textNode.textContent = text; // Use textContent to prevent XSS
        messageDiv.innerHTML = icon;
        messageDiv.appendChild(textNode);

        if (type === 'bot' && Array.isArray(audioUrls) && audioUrls.length > 0) {
            const controlsWrap = document.createElement('div');
            controlsWrap.className = 'd-flex align-items-center mt-2';
            const speaker = document.createElement('i');
            speaker.className = 'fas fa-volume-up speaker-icon';
            controlsWrap.appendChild(speaker);

            const playingIndicator = document.createElement('span');
            playingIndicator.className = 'playing-indicator';
            playingIndicator.style.display = 'none';
            playingIndicator.innerHTML = '<span class="bar"></span><span class="bar"></span><span class="bar"></span>';
            controlsWrap.appendChild(playingIndicator);

            messageDiv.appendChild(controlsWrap);

            // Play audio sequentially
            if (!isPlayingAudio) {
                isPlayingAudio = true;
                (async () => {
                    try {
                        playingIndicator.style.display = 'inline-flex';
                        const rate = getPlaybackRate();
                        await playAudioUrlsSequentially(audioUrls, rate);
                    } catch (e) {
                        console.warn('Audio play error', e);
                    } finally {
                        playingIndicator.style.display = 'none';
                        isPlayingAudio = false;
                    }
                })();
            }
        }

        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // Play single audio file
    function playSingleAudio(url, rate = 1.25) {
        return new Promise((resolve, reject) => {
            if (!url || typeof url !== 'string') {
                console.warn('Invalid audio URL');
                return resolve();
            }

            const audio = new Audio();
            audio.src = url;
            audio.crossOrigin = 'anonymous';
            audio.preload = 'auto';
            audio.playbackRate = rate;

            const cleanup = () => {
                audio.pause();
                audio.src = '';
                audio.remove();
            };

            audio.addEventListener('ended', () => {
                cleanup();
                resolve();
            }, { once: true });

            audio.addEventListener('error', (e) => {
                console.warn('Audio error', e);
                cleanup();
                resolve(); // Continue sequence even on error
            }, { once: true });

            audio.addEventListener('canplaythrough', () => {
                audio.play().catch(err => {
                    console.warn('Play rejected', err);
                    cleanup();
                    resolve();
                });
            }, { once: true });

            // Fallback: attempt play after delay
            setTimeout(() => {
                audio.play().catch(() => resolve());
            }, 300);
        });
    }

    // Play audio URLs sequentially
    async function playAudioUrlsSequentially(audioUrls, rate = 1.25) {
        for (const url of audioUrls) {
            await playSingleAudio(url, rate);
        }
    }

    // Send question to server
    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question) return;
        appendMessage('user', question);
        questionInput.value = '';
        loadingSpinner.style.display = 'inline-block';
        errorMessage.textContent = '';

        try {
            const res = await fetch(`/ask?q=${encodeURIComponent(question)}&lang=${currentLang}`);
            if (!res.ok) throw new Error('Network error');
            const data = await res.json();
            const answerKey = currentLang === 'bn' ? 'answer_bn' : 'answer_en';
            const audioUrlsKey = currentLang === 'bn' ? 'audio_urls_bn' : 'audio_urls_en';
            appendMessage('bot', data[answerKey] || 'No response', data[audioUrlsKey] || []);
        } catch (err) {
            console.error(err);
            errorMessage.textContent = currentLang === 'bn' ? 'কিছু ভুল হয়েছে। আবার চেষ্টা করুন।' : 'Something went wrong. Please try again.';
        } finally {
            loadingSpinner.style.display = 'none';
        }
    }

    sendBtn.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendQuestion(); });

    // Voice input with listening animation
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            voiceBtn.classList.add('listening');
            voiceBtn.innerHTML = '<i class="fas fa-circle" style="color:#dc3545;"></i>';
            errorMessage.textContent = '';
            // Timeout to prevent hanging
            setTimeout(() => {
                if (voiceBtn.classList.contains('listening')) {
                    recognition.stop();
                }
            }, 10000);
        };

        recognition.onend = () => {
            voiceBtn.classList.remove('listening');
            voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript || '';
            questionInput.value = transcript;
            sendQuestion();
        };

        recognition.onerror = (ev) => {
            console.warn('Recognition error', ev.error);
            errorMessage.textContent = currentLang === 'bn' ? 'ভয়েস ইনপুটে সমস্যা হয়েছে।' : 'Voice input error.';
            recognition.stop();
        };

        voiceBtn.addEventListener('click', () => {
            try {
                if (voiceBtn.classList.contains('listening')) {
                    recognition.stop();
                } else {
                    recognition.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
                    recognition.start();
                }
            } catch (e) {
                console.warn('Mic start error', e);
                errorMessage.textContent = currentLang === 'bn' ? 'মাইক্রোফোন শুরু করতে সমস্যা।' : 'Error starting microphone.';
            }
        });
    } else {
        voiceBtn.style.display = 'none';
        errorMessage.textContent = currentLang === 'bn' ? 'ভয়েস ইনপুট সমর্থিত নয়।' : 'Voice input not supported.';
    }

    // Accessibility: Enhanced keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey) {
            if (e.key === ',' || e.key === '<') {
                speedRange.stepDown();
                speedRange.dispatchEvent(new Event('input'));
            } else if (e.key === '.' || e.key === '>') {
                speedRange.stepUp();
                speedRange.dispatchEvent(new Event('input'));
            }
        }
        if (e.key === 'v' && e.ctrlKey) {
            voiceBtn.click();
        }
    });

    // Initialize UI preferences
    (function loadUiPrefs() {
        const savedSpeed = localStorage.getItem('playback_rate');
        if (savedSpeed) {
            speedRange.value = savedSpeed;
            speedLabel.textContent = `Speed: ${parseFloat(savedSpeed).toFixed(2)}x`;
        } else {
            localStorage.setItem('playback_rate', speedRange.value);
        }
    })();
    </script>
</body>
</html>
