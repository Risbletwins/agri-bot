<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কৃষি সহকারী চ্যাট | Agri Servitor Chat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; background-color: #f8f9fa; color: #333; height: 100vh; display: flex; flex-direction: column; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; }
        .chat-message { margin-bottom: 15px; padding: 10px 15px; border-radius: 10px; max-width: 80%; }
        .user-message { background-color: #dcf8c6; align-self: flex-end; }
        .bot-message { background-color: #ffffff; border: 1px solid #ddd; align-self: flex-start; }
        .input-group { padding: 10px; background-color: #fff; border-top: 1px solid #ddd; }
        .lang-toggle { position: absolute; top: 10px; right: 10px; z-index: 1000; }
        .audio-player { margin-top: 10px; }
        .spinner { display: none; }
        .error-message { color: red; text-align: center; }
        footer { background-color: #e9ecef; padding: 10px 0; text-align: center; font-size: 0.8rem; }
    </style>
</head>
<body>
    <!-- Language Toggle -->
    <div class="lang-toggle">
        <button id="lang-btn" class="btn btn-secondary">English</button>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">কৃষি সহকারী</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">হোম</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/chat">কৃষি সহকারী</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Chat Container -->
    <div class="chat-container d-flex flex-column" id="chat-history">
        <!-- Welcome Message -->
        <div class="chat-message bot-message">
            <i class="fas fa-robot me-2"></i>
            <span data-bn="স্বাগতম! আপনার কৃষি সংক্রান্ত যেকোনো প্রশ্ন করুন।" data-en="Welcome! Ask any agriculture-related questions.">স্বাগতম! আপনার কৃষি সংক্রান্ত যেকোনো প্রশ্ন করুন।</span>
        </div>
    </div>

    <!-- Input Group -->
    <div class="input-group">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="input-group">
                        <input type="text" id="question-input" class="form-control" placeholder="আপনার প্রশ্ন লিখুন..." aria-label="Question input">
                        <button id="voice-btn" class="btn btn-outline-secondary"><i class="fas fa-microphone"></i></button>
                        <button id="send-btn" class="btn btn-primary"><i class="fas fa-paper-plane"></i> <span data-bn="পাঠান" data-en="Send">পাঠান</span></button>
                    </div>
                    <div id="loading-spinner" class="spinner-border text-primary mt-2 spinner" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p id="error-message" class="error-message mt-2"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p data-bn="© ২০২৫ কৃষি সহকারী — কৃষকদের ক্ষমতায়ন এআই ও অটোমেশনের মাধ্যমে" data-en="© 2025 Agri Servitor — Empowering farmers through AI and automation">© ২০২৫ কৃষি সহকারী — কৃষকদের ক্ষমতায়ন এআই ও অটোমেশনের মাধ্যমে</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Language Toggle and Chat Script -->
    <script>
        const langBtn = document.getElementById('lang-btn');
        const elements = document.querySelectorAll('[data-bn], [data-en]');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const chatHistory = document.getElementById('chat-history');
        const loadingSpinner = document.getElementById('loading-spinner');
        const errorMessage = document.getElementById('error-message');
        let currentLang = localStorage.getItem('lang') || 'bn';
        let recognition;

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            localStorage.setItem('lang', currentLang);
            langBtn.textContent = currentLang === 'bn' ? 'English' : 'বাংলা';
            elements.forEach(el => {
                el.textContent = el.getAttribute(`data-${currentLang}`);
            });
            questionInput.placeholder = currentLang === 'bn' ? 'আপনার প্রশ্ন লিখুন...' : 'Type your question...';
            document.documentElement.lang = currentLang;
        }

        // Initial setup
        if (currentLang === 'en') toggleLanguage();
        langBtn.addEventListener('click', toggleLanguage);

        // Chat Submission
        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            // Append user message
            appendMessage('user', question);
            questionInput.value = '';
            loadingSpinner.style.display = 'block';
            errorMessage.textContent = '';

            try {
                const response = await fetch(`/ask?q=${encodeURIComponent(question)}&lang=${currentLang}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                // Append bot message
                const answerKey = currentLang === 'bn' ? 'answer_bn' : 'answer_en';
                const audioUrlsKey = currentLang === 'bn' ? 'audio_urls_bn' : 'audio_urls_en';
                appendMessage('bot', data[answerKey], data[audioUrlsKey]);
            } catch (error) {
                errorMessage.textContent = currentLang === 'bn' ? 'কিছু ভুল হয়েছে। আবার চেষ্টা করুন।' : 'Something went wrong. Please try again.';
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        function appendMessage(type, text, audioUrls = []) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('chat-message', type === 'user' ? 'user-message' : 'bot-message');
            const icon = type === 'bot' ? '<i class="fas fa-robot me-2"></i>' : '<i class="fas fa-user me-2"></i>';
            messageDiv.innerHTML = `${icon}${text}`;

            if (type === 'bot' && audioUrls.length > 0) {
                const audioPlayer = document.createElement('div');
                audioPlayer.classList.add('audio-player');
                audioUrls.forEach(url => {
                    const audio = document.createElement('audio');
                    audio.controls = true;
                    audio.autoplay = true;
                    audio.src = url;
                    audioPlayer.appendChild(audio);
                });
                messageDiv.appendChild(audioPlayer);
            }

            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Voice Input
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = event => {
                questionInput.value = event.results[0][0].transcript;
                sendQuestion();
            };

            recognition.onerror = event => {
                errorMessage.textContent = currentLang === 'bn' ? 'ভয়েস ইনপুটে সমস্যা হয়েছে।' : 'Voice input error.';
            };

            voiceBtn.addEventListener('click', () => {
                recognition.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';
                recognition.start();
            });
        } else {
            voiceBtn.style.display = 'none'; // Hide if not supported
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendQuestion);
        questionInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendQuestion(); });
    </script>
</body>
</html>
