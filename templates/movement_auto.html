<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Krishonyx</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #90C67C;
            --secondary-color: #90C67C;
            --bg-color: #328E6E;
            --text-color: #000000;
            --icon-color: #333333;
            --accent-color: #67AE6E;
            --shadow: 0 10px 6px rgba(0, 0, 0, 0.1);
            --sidebaroptionscolor: #E1EEBC;
            --sidebaroptionshovercolor: #e1eebccc;
        }

        body.dark-mode {
            --primary-color: #1A2A80;
            --secondary-color: #1A2A80;
            --bg-color: #3B38A0;
            --text-color: #ffffff;
            --icon-color: #ECDFCC;
            --accent-color: #3d57e9;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --sidebaroptionscolor: rgba(173, 216, 230, 0.548);
            --sidebaroptionshovercolor: rgb(58, 58, 214);
        }

        body {
            font-family: 'Roboto', 'Noto Sans Bengali', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            transition: all 0.3s ease;
        }

        .navbar {
            background-color: var(--secondary-color);
            box-shadow: var(--shadow);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: var(--secondary-color);
            transition: left 0.3s ease;
            box-shadow: var(--shadow);
            z-index: 1050;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar ul {
            list-style: none;
            padding: 20px;
        }

        .sidebar li {
            margin-bottom: 10px;
        }

        .sidebar a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
        }

        .sidebaroptions {
            background-color: var(--sidebaroptionscolor);
            padding: 10px;
            border-radius: 10px;
        }

        .sidebaroptions:hover {
            background-color: var(--sidebaroptionshovercolor);
        }

        /* Settings Dropdown */
        .settings-dropdown {
            position: absolute;
            top: 60px;
            right: 10px;
            background-color: var(--secondary-color);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 1000;
        }

        .settings-dropdown.active {
            display: block;
        }

        .settings-dropdown .form-check-label,
        .settings-dropdown label {
            color: var(--text-color);
        }

        #settings-btn{
          border: none;
          position: fixed;  
          right: 10px;
          color: var(--icon-color);
        }
        #sidebar-toggle{
          border: none;
          position: fixed;  
          left: 10px;
          color: var(--icon-color);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Sidebar Toggle Button -->
            <button id="sidebar-toggle" class="btn btn-outline-secondary" aria-label="Toggle sidebar">
                <i class="fas fa-bars"></i>
            </button>
            <!-- Centered Header -->
            <a class="navbar-brand mx-auto" href="/">Krishonyx</a>
            <!-- Settings Button -->
            <button id="settings-btn" class="btn btn-outline-secondary" aria-label="Settings">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <ul>
            <li class="sidebaroptions"><a href="/">Home</a></li>
            <li class="sidebaroptions"><a href="/chat">Chat</a></li>
            <li class="sidebaroptions"><a href="/move-auto">Control Auto</a></li>
            <li class="sidebaroptions"><a href="/move-manual">Control Manual</a></li>
        </ul>
    </div>

    <!-- Settings Dropdown -->
    <div class="settings-dropdown" id="settings-dropdown">
        <h6>Settings</h6>
        <hr>
        <!-- Language Option -->
        <div class="mb-3">
            <label>Language</label>
            <select id="lang-select" class="form-select">
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
            </select>
        </div>
        <!-- Theme Options -->
        <div class="mb-3">
            <label>Theme</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="theme" id="light-mode" checked>
                <label class="form-check-label" for="light-mode">Light Mode</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="theme" id="dark-mode">
                <label class="form-check-label" for="dark-mode">Dark Mode</label>
            </div>
        </div>
        <!-- Voice Speed -->
        <div class="mb-3 speed-control">
            <label for="speed-range">Voice Speed: <span id="speed-label">1.25x</span></label>
            <input id="speed-range" type="range" min="0.6" max="2.0" step="0.05" value="1.25" class="form-range" />
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsDropdown = document.getElementById('settings-dropdown');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        settingsBtn.addEventListener('click', () => {
            settingsDropdown.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!settingsBtn.contains(e.target) && !settingsDropdown.contains(e.target)) {
                settingsDropdown.classList.remove('active');
            }
            if (!sidebarToggle.contains(e.target) && !sidebar.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        });
    </script>
</body>
</html>
